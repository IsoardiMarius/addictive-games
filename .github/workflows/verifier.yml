# Vérifications sans Unity : compilation du cœur, tests automatiques, compilation de la couche Unity
# contre des bibliothèques de référence. Aucun secret, aucune licence Unity nécessaire.
# Déclenchement manuel ou sur pull request (pas à chaque push, pour ne pas consommer de minutes sans le vouloir).
name: Vérifications (sans Unity)

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilation, tests et vérifications
        run: bash game/Tools/verifier.sh
